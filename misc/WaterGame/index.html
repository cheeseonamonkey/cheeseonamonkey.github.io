<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0ca8b8">
  <meta name="description" content="A tiny mobile water-ring toy. Tilt your phone and press the yellow pumps.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-title" content="WaterGame">
  <title>WaterGame</title>
  <style>
    :root{color-scheme:dark;--ink:#0b4550;--glass:rgba(235,255,255,.82);--yellow:#ffdf21;--yellow-edge:#d2a800}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;background:#07191d}
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07191d;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    button{font:inherit;-webkit-tap-highlight-color:transparent;transition:transform .08s ease,filter .08s ease,background-color .08s ease}
    button:active,.upload-label:active{transform:scale(.95);filter:brightness(.92)}
    #app{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#07191d}
    .stage{position:absolute;left:50%;top:50%;width:100vw;height:100vh;transform:translate(-50%,-50%);overflow:hidden;background:linear-gradient(145deg,#8fcfca 0%,#4eaaaE 55%,#2e7f89 100%)}
    .stage.forced-landscape{width:100vh;height:100vw;transform:translate(-50%,-50%) rotate(90deg)}
    canvas{display:block;width:100%;height:100%}
    .topbar{position:absolute;z-index:5;top:22px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
    .quick,.actions{display:flex;align-items:center;gap:7px;min-width:0}
    .quick{justify-content:flex-start}
    .actions{justify-content:flex-end}
    .iconbtn{pointer-events:auto;border:1px solid rgba(255,255,255,.38);background:rgba(237,248,247,.78);color:#173d42;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
    .iconbtn{min-height:34px;padding:7px 10px;border-radius:12px;font-size:12px;font-weight:760;cursor:pointer}
    .iconbtn:active{transform:translateY(1px) scale(.98)}
    .pump{position:absolute;z-index:4;top:63%;width:112px;height:112px;margin-top:-56px;border-radius:50%;border:4px solid #b99d27;background:#e8cf48;box-shadow:0 2px 5px rgba(0,45,50,.22);cursor:pointer;touch-action:manipulation;transition:transform .025s linear,filter .025s linear,box-shadow .025s linear}
    .pump::after{content:"";position:absolute;inset:16px;border-radius:50%;border:1px solid rgba(105,88,20,.24)}
    .pump.left{left:max(18px,calc(env(safe-area-inset-left) + 6px))}
    .pump.right{right:max(18px,calc(env(safe-area-inset-right) + 6px))}
    .pump:active,.pump.touching{transform:scale(.90);filter:brightness(.88);box-shadow:inset 0 5px 10px rgba(105,88,20,.28),0 1px 2px rgba(0,45,50,.12)}
    .motion-needed{animation:nudge 2.1s ease-in-out infinite;background:rgba(255,229,91,.94);border-color:rgba(255,255,255,.7);font-size:13px;font-weight:850;padding:8px 12px;box-shadow:0 2px 9px rgba(77,61,0,.18)}
    .settings{position:absolute;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);width:min(330px,calc(100% - 40px));max-height:calc(100% - 40px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px;border-radius:11px;background:rgba(237,246,245,.95);color:#173d42;box-shadow:0 8px 24px rgba(0,28,34,.20);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    .settings[hidden]{display:none}
    .settings h2{font-size:14px;margin:0 0 10px}
    .setting{display:grid;grid-template-columns:92px 1fr 48px;align-items:center;gap:8px;margin:9px 0;font-size:12px;font-weight:700}
    .setting output{text-align:right;font-variant-numeric:tabular-nums}
    .setting input[type=range]{width:100%;accent-color:#129ead}
    .angle-guide{grid-column:2/4;height:22px;position:relative;margin:-5px 4px 2px;opacity:.62}
    .angle-guide::before{content:"";position:absolute;left:50%;bottom:1px;width:1px;height:19px;background:#52777b}
    .angle-guide i{position:absolute;left:50%;bottom:1px;width:1px;height:19px;background:#0d7f8b;transform-origin:50% 100%;transition:transform .08s}
    .angle-guide::after{content:"";position:absolute;left:calc(50% - 13px);bottom:0;width:26px;height:1px;background:#789497}
    .settings-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
    .settings-row button,.upload-label{border:0;border-radius:10px;background:#fff;color:#123c43;padding:8px 10px;font-size:12px;font-weight:750;box-shadow:0 2px 8px rgba(0,60,70,.12);cursor:pointer}
    .quick .upload-label{pointer-events:auto;border:1px solid rgba(255,255,255,.38);background:rgba(237,248,247,.82);color:#173d42;border-radius:12px;padding:7px 10px;font-size:12px;font-weight:760;box-shadow:none;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
    .upload-label input{display:none}
    .settings small{display:block;margin-top:9px;line-height:1.3;opacity:.68}
    .love{position:absolute;z-index:4;right:max(16px,calc(env(safe-area-inset-right) + 8px));bottom:max(14px,calc(env(safe-area-inset-bottom) + 8px));font-size:9px;letter-spacing:.08em;color:rgba(236,248,247,.62);text-decoration:none;text-shadow:0 1px 2px rgba(0,30,35,.45);white-space:nowrap}
    @keyframes nudge{0%,75%,100%{transform:none}82%{transform:rotate(-3deg)}90%{transform:rotate(3deg)}}
    @media(min-width:680px){.stage{max-width:560px;max-height:900px;border-radius:34px;box-shadow:0 24px 80px #0008}.pump{width:124px;height:124px;margin-top:-62px}}
    @media(max-height:620px),(max-width:620px){.topbar{top:18px;left:20px;right:20px;gap:6px}.quick,.actions{gap:4px}.iconbtn,.quick .upload-label{font-size:10px;padding:6px 7px;min-height:30px}.motion-needed{font-size:11px;padding:7px 9px}.pump{width:101px;height:101px;margin-top:-50.5px}.settings{width:min(330px,calc(100% - 34px));max-height:calc(100% - 34px)}}
    @media(max-height:430px){.topbar{top:16px;left:18px;right:18px}.iconbtn,.quick .upload-label{font-size:9px;padding:5px 6px}.motion-needed{font-size:10px;padding:6px 8px}.pump{width:97px;height:97px;margin-top:-48.5px}.settings{width:calc(100% - 30px);max-height:calc(100% - 30px);padding:10px}.setting{margin:7px 0}.angle-guide{height:18px}}
  </style>
</head>
<body>
<div id="app"></div>
<script type="module">
class Vec2{
  constructor(x=0,y=0){this.x=x;this.y=y}
  set(x,y){this.x=x;this.y=y;return this}
  addScaled(v,n){this.x+=v.x*n;this.y+=v.y*n;return this}
  scale(n){this.x*=n;this.y*=n;return this}
  length(){return Math.hypot(this.x,this.y)}
}
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const TAU=Math.PI*2;

class FixedStepLoop{
  constructor(client,fps=60){this.client=client;this.step=1/fps;this.acc=0;this.last=performance.now();this.running=false}
  start(){if(this.running)return;this.running=true;this.last=performance.now();requestAnimationFrame(this.frame)}
  frame=(now)=>{if(!this.running)return;const elapsed=Math.min((now-this.last)/1000,.05);this.last=now;this.acc+=elapsed;while(this.acc>=this.step){this.client.update(this.step);this.acc-=this.step}this.client.render(this.acc/this.step,now);requestAnimationFrame(this.frame)}
}

let NEXT_ID=1;
class Entity{constructor(prefix){this.id=prefix+'-'+NEXT_ID++}}
class CircleBody extends Entity{
  constructor(prefix,radius){super(prefix);this.radius=radius;this.position=new Vec2();this.velocity=new Vec2()}
}
class Ring extends CircleBody{
  constructor(color){super('ring',9.5);this.color=color;this.baseRadius=9.5;this.baseHoleRadius=5;this.holeRadius=5;this.waterVx=0;this.waterVy=0;this.waterReady=false}
  setScale(scale){this.radius=this.baseRadius*scale;this.holeRadius=this.baseHoleRadius*scale}
}
class Peg extends CircleBody{
  constructor(x,y,radius=7){super('peg',radius);this.position.set(x,y)}
}

const TankDefinition={
  left:.115,right:.885,top:.105,bottom:.925,
  pegs:[
    {x:.43,y:.47,r:7},{x:.57,y:.42,r:7},{x:.48,y:.60,r:7},{x:.62,y:.57,r:7},
    {x:.39,y:.70,r:7},{x:.58,y:.73,r:7}
  ]
};

class GameWorld{
  constructor(){this.width=0;this.height=0;this.left=0;this.right=0;this.top=0;this.bottom=0;this.gravityStrength=650;this.pumpStrength=760;this.pumpAngle=14;this.ringScale=1;this.gravity=new Vec2(0,this.gravityStrength);this.rings=[];this.pegs=[];this.bubbles=[]}
}

class WorldFactory{
  constructor(definition,count=24){this.definition=definition;this.count=count;this.colors=['#ff5f88','#ff9d31','#e6e543','#75dd66','#3bc1f0','#b879e9']}
  resize(world,w,h){
    world.width=w;world.height=h;
    world.left=w*this.definition.left;world.right=w*this.definition.right;world.top=h*this.definition.top;world.bottom=h*this.definition.bottom;
    world.pegs=this.definition.pegs.map(p=>new Peg(w*p.x,h*p.y,p.r*Math.max(.9,Math.min(1.25,w/390))));
  }
  seed(world){
    world.rings=[];
    const scale=Math.max(.9,Math.min(1.25,world.width/390))*world.ringScale;
    for(let i=0;i<this.count;i++){const ring=new Ring(this.colors[i%this.colors.length]);ring.setScale(scale);ring.position.set(world.width*(.28+Math.random()*.43),world.height*(.16+Math.random()*.19));ring.velocity.set((Math.random()-.5)*30,Math.random()*15);world.rings.push(ring)}
    world.bubbles=[];
  }
}

class PhysicsEngine{
  constructor(){this.drag=.9925;this.restitution=.36}
  update(world,dt){
    for(const ring of world.rings){
      const speed=Math.hypot(ring.velocity.x,ring.velocity.y);
      const waterAccel=.80+.24*Math.min(1,speed/230);
      ring.velocity.x=(ring.velocity.x+world.gravity.x*waterAccel*dt)*this.drag;
      ring.velocity.y=(ring.velocity.y+world.gravity.y*waterAccel*dt)*this.drag;
      ring.position.addScaled(ring.velocity,dt);
      this.bounds(world,ring);
      for(const peg of world.pegs)this.pegCollision(ring,peg);
    }
    for(let i=0;i<world.rings.length;i++)for(let j=i+1;j<world.rings.length;j++){const a=world.rings[i],b=world.rings[j];this.circle(a,b)}
  }
  bounds(w,a){
    const p=a.position,v=a.velocity,r=a.radius,e=this.restitution;
    if(p.x-r<w.left){p.x=w.left+r;v.x=Math.abs(v.x)*e}
    if(p.x+r>w.right){p.x=w.right-r;v.x=-Math.abs(v.x)*e}
    if(p.y-r<w.top){p.y=w.top+r;v.y=Math.abs(v.y)*e}
    if(p.y+r>w.bottom){p.y=w.bottom-r;v.y=-Math.abs(v.y)*e}
  }
  pegCollision(ring,peg){
    const dx=ring.position.x-peg.position.x,dy=ring.position.y-peg.position.y,d=Math.hypot(dx,dy)||.001;
    const outer=ring.radius+peg.radius;
    const inner=Math.max(0,ring.holeRadius-peg.radius*.65);
    if(d<inner)return;
    if(d>=outer)return;
    const nx=dx/d,ny=dy/d,over=outer-d;
    ring.position.x+=nx*over;ring.position.y+=ny*over;
    const along=ring.velocity.x*nx+ring.velocity.y*ny;
    if(along<0){ring.velocity.x-=along*(1+this.restitution)*nx;ring.velocity.y-=along*(1+this.restitution)*ny}
  }
  circle(a,b){
    const dx=a.position.x-b.position.x,dy=a.position.y-b.position.y,d=Math.hypot(dx,dy)||.001,min=a.radius+b.radius;
    if(d>=min)return;
    const nx=dx/d,ny=dy/d,over=(min-d)*.5;
    a.position.x+=nx*over;a.position.y+=ny*over;b.position.x-=nx*over;b.position.y-=ny*over;
    const along=(a.velocity.x-b.velocity.x)*nx+(a.velocity.y-b.velocity.y)*ny;
    if(along>=0)return;
    const impulse=-(1+this.restitution)*along*.5;
    a.velocity.x+=impulse*nx;a.velocity.y+=impulse*ny;b.velocity.x-=impulse*nx;b.velocity.y-=impulse*ny;
  }
}

class PumpJetService{
  fire(world,side){
    const sourceX=side<0?world.left+world.width*.05:world.right-world.width*.05;
    const sourceY=world.bottom-world.height*.055;
    for(const ring of world.rings){
      const rise=Math.max(0,sourceY-ring.position.y),spread=.07+rise/(world.height*.42)*.20;
      // One angle control, mirrored per pump: positive always means inward.
      const centerX=sourceX-side*Math.tan(world.pumpAngle*Math.PI/180)*rise;
      const dx=(ring.position.x-centerX)/(world.width*spread),dy=rise/(world.height*.48);
      const distance=Math.hypot(dx,dy);
      const falloff=Math.max(0,1-distance);
      if(!falloff)continue;
      const turbulence=.82+Math.random()*.36;
      const strength=world.pumpStrength*(.95+.08*falloff);
      const angle=world.pumpAngle*Math.PI/180;
      const outward=Math.sign(ring.position.x-centerX)*strength*.12*Math.min(1,dy*1.7)*falloff;
      ring.velocity.y-=Math.cos(angle)*strength*falloff*turbulence;
      ring.velocity.x+=-side*Math.sin(angle)*strength*falloff*turbulence+outward+(Math.random()-.5)*(strength*.08)*falloff;
    }
    const bubblePower=clamp(world.pumpStrength/760,.45,1.7);
    const bubbleCount=Math.round(24+8*bubblePower);
    for(let i=0;i<bubbleCount;i++){
      const fan=(Math.random()-.5)*(.38+.06*bubblePower),angle=world.pumpAngle*Math.PI/180+fan;
      const speed=(88+Math.random()*125)*(.72+.38*bubblePower);
      world.bubbles.push({
        x:sourceX+(Math.random()-.5)*(18+6*bubblePower),
        y:sourceY+Math.random()*(16+5*bubblePower),
        vx:-side*Math.sin(angle)*speed,
        vy:-Math.cos(angle)*speed*(.95+Math.random()*.32),
        r:1.15+Math.random()*(3.8+.9*bubblePower),
        life:.58+Math.random()*.82,
        alpha:.32+Math.random()*.44
      })
    }
  }
}

class ParticleSystem{
  update(world,dt){
    for(const ring of world.rings){
      const vx=ring.velocity.x,vy=ring.velocity.y,speed=Math.hypot(vx,vy);
      if(ring.waterReady){
        const prevSpeed=Math.hypot(ring.waterVx,ring.waterVy);
        const dot=(ring.waterVx*vx+ring.waterVy*vy)/Math.max(1,prevSpeed*speed);
        const turned=prevSpeed>45&&speed>45&&dot<.55;
        const abrupt=Math.hypot(vx-ring.waterVx,vy-ring.waterVy)>52;
        if((turned&&Math.random()<.20)||(abrupt&&Math.random()<.09)||(speed>115&&Math.random()<.00065)){
          const count=(turned||abrupt)&&Math.random()<.28?2:1;
          for(let i=0;i<count;i++)world.bubbles.push({
            x:ring.position.x+(Math.random()-.5)*ring.radius,
            y:ring.position.y+(Math.random()-.5)*ring.radius,
            vx:(Math.random()-.5)*14,vy:-8-Math.random()*20,
            r:.6+Math.random()*1.25,life:.65+Math.random()*.7,alpha:.12+Math.random()*.18
          })
        }
      }
      ring.waterVx=vx;ring.waterVy=vy;ring.waterReady=true;
    }
    if(Math.random()<dt*.32){
      world.bubbles.push({
        x:world.left+Math.random()*(world.right-world.left),
        y:world.top+(world.bottom-world.top)*(.45+Math.random()*.5),
        vx:(Math.random()-.5)*4,vy:-3-Math.random()*8,
        r:.45+Math.random()*.75,life:1.4+Math.random()*1.5,alpha:.08+Math.random()*.08
      })
    }
    for(const b of world.bubbles){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy-=6*dt;b.life-=dt}
    world.bubbles=world.bubbles.filter(b=>b.life>0&&b.y>world.top);
  }
}

class CanvasRenderer{
  constructor(canvas){this.canvas=canvas;this.ctx=canvas.getContext('2d');this.w=0;this.h=0;this.backgroundImage=null;this.duckImage=null;this.duckRect=null}
  setBackgroundImage(image){this.backgroundImage=image}
  setDuckImage(image){if(this.duckImage?._objectUrl)URL.revokeObjectURL(this.duckImage._objectUrl);this.duckImage=image;this.duckRect=null}
  clearDuck(){if(this.duckImage?._objectUrl)URL.revokeObjectURL(this.duckImage._objectUrl);this.duckImage=null;this.duckRect=null}
  isDuckAt(x,y){const r=this.duckRect;return !!r&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h}
  clearBackgroundImage(){if(this.backgroundImage?._objectUrl)URL.revokeObjectURL(this.backgroundImage._objectUrl);this.backgroundImage=null}
  resize(w,h){this.w=w;this.h=h;const d=Math.min(devicePixelRatio||1,2);this.canvas.width=Math.round(w*d);this.canvas.height=Math.round(h*d);this.ctx.setTransform(d,0,0,d,0,0)}
  render(world,time){
    const c=this.ctx,w=this.w,h=this.h;
    c.clearRect(0,0,w,h);
    if(this.backgroundImage){
      const img=this.backgroundImage,ir=img.naturalWidth/img.naturalHeight,cr=w/h;
      let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;
      if(ir>cr){sw=img.naturalHeight*cr;sx=(img.naturalWidth-sw)/2}else{sh=img.naturalWidth/cr;sy=(img.naturalHeight-sh)/2}
      c.drawImage(img,sx,sy,sw,sh,0,0,w,h);
      const tint=c.createLinearGradient(0,0,w,h);tint.addColorStop(0,'rgba(164,251,239,.16)');tint.addColorStop(1,'rgba(0,100,120,.26)');c.fillStyle=tint;c.fillRect(0,0,w,h);
    }else{
      const water=c.createLinearGradient(0,0,w,h);water.addColorStop(0,'#8fcfca');water.addColorStop(.52,'#4eaaae');water.addColorStop(1,'#2e7f89');c.fillStyle=water;c.fillRect(0,0,w,h);
    }

    c.save();c.beginPath();c.roundRect(world.left,world.top,world.right-world.left,world.bottom-world.top,22);c.clip();
    this.drawScene(c,world,time);
    if(this.duckImage)this.drawDuck(c,world);
    c.restore();

    c.strokeStyle='rgba(226,245,243,.60)';c.lineWidth=3;c.beginPath();c.roundRect(world.left,world.top,world.right-world.left,world.bottom-world.top,16);c.stroke();

    for(const peg of world.pegs){c.fillStyle='rgba(39,139,142,.62)';c.beginPath();c.arc(peg.position.x,peg.position.y,peg.radius,0,TAU);c.fill()}
    for(const ring of world.rings)this.drawRing(c,ring);
    for(const b of world.bubbles){c.globalAlpha=Math.min(b.alpha??.7,b.life*(b.alpha??.7)*1.7);c.strokeStyle='rgba(255,255,255,.88)';c.lineWidth=b.r<1.5?.8:1.1;c.beginPath();c.arc(b.x,b.y,b.r,0,TAU);c.stroke()}c.globalAlpha=1;
  }
  drawRing(c,r){
    c.strokeStyle=r.color;c.lineWidth=Math.max(3,r.radius-r.holeRadius);c.beginPath();c.arc(r.position.x,r.position.y,(r.radius+r.holeRadius)/2,0,TAU);c.stroke();
  }
  drawDuck(c,w){
    const img=this.duckImage,maxW=(w.right-w.left)*.30,maxH=(w.bottom-w.top)*.34,ratio=img.naturalWidth/img.naturalHeight;
    let dw=maxW,dh=dw/ratio;if(dh>maxH){dh=maxH;dw=dh*ratio}
    const x=(w.left+w.right-dw)/2,y=w.top+(w.bottom-w.top)*.13;
    this.duckRect={x,y,w:dw,h:dh};
    c.drawImage(img,x,y,dw,dh);
  }
  drawScene(c,w,time){
    const width=w.width,height=w.height;
    const floor=c.createLinearGradient(0,height*.76,0,w.bottom);
    floor.addColorStop(0,'rgba(221,211,160,0)');
    floor.addColorStop(1,'rgba(210,199,145,.46)');
    c.fillStyle=floor;c.fillRect(w.left,height*.72,w.right-w.left,w.bottom-height*.72);

    c.strokeStyle='rgba(34,125,112,.36)';c.lineWidth=5;c.lineCap='round';
    const sway=Math.sin(time*.0015)*2;
    [[.27,.83,-10],[.73,.82,8]].forEach(p=>{const x=width*p[0],y=height*p[1];c.beginPath();c.moveTo(x,w.bottom);c.quadraticCurveTo(x+p[2],y+24,x+p[2]*.4+sway,y);c.stroke()});

    c.fillStyle='rgba(238,248,245,.14)';
    for(let i=0;i<8;i++){const x=w.left+25+((i*83)%Math.max(50,w.right-w.left-50)),y=w.top+30+((i*59+time*.005)%Math.max(60,w.bottom-w.top-80));c.beginPath();c.arc(x,y,1.5+(i%2),0,TAU);c.fill()}
  }
}

class GameSession{
  constructor(renderer){this.renderer=renderer;this.world=new GameWorld();this.factory=new WorldFactory(TankDefinition);this.physics=new PhysicsEngine();this.pumps=new PumpJetService();this.particles=new ParticleSystem();this.loop=new FixedStepLoop(this,60)}
  resize(w,h){
    const first=!this.world.width,oldW=this.world.width,oldH=this.world.height;
    this.factory.resize(this.world,w,h);
    if(first)this.factory.seed(this.world);
    else if(oldW&&oldH&&(oldW!==w||oldH!==h)){
      const sx=w/oldW,sy=h/oldH;
      for(const ring of this.world.rings){ring.position.x*=sx;ring.position.y*=sy;ring.velocity.x*=sx;ring.velocity.y*=sy}
      const scale=Math.max(.9,Math.min(1.25,w/390))*this.world.ringScale;
      for(const ring of this.world.rings)ring.setScale(scale);
      this.world.bubbles=[];
    }
    this.renderer.resize(w,h)
  }
  reset(){this.factory.seed(this.world)}
  pump(side){this.pumps.fire(this.world,side)}
  setGravity(x,y){this.world.gravity.set(x,y)}
  setGravityStrength(value){this.world.gravityStrength=value;const len=this.world.gravity.length()||1;this.world.gravity.scale(value/len)}
  setPumpStrength(value){this.world.pumpStrength=value}
  setPumpAngle(value){this.world.pumpAngle=clamp(value,0,30)}
  setRingScale(value){this.world.ringScale=value;const scale=Math.max(.9,Math.min(1.25,this.world.width/390))*value;for(const ring of this.world.rings)ring.setScale(scale)}
  update(dt){this.physics.update(this.world,dt);this.particles.update(this.world,dt)}
  render(_alpha,time){this.renderer.render(this.world,time)}
  start(){this.loop.start()}
}

class DeviceOrientationInput{
  constructor(game,status,button){this.game=game;this.status=status;this.button=button;this.virtualRotation=0;this.active=false;this.lastRx=0;this.lastRy=0}
  startDefault(){
    const D=window.DeviceOrientationEvent;if(!D)return false;
    if(typeof D.requestPermission==='function')return false;
    window.addEventListener('deviceorientation',this.handle,{passive:true});this.active=true;this.status.textContent='tilt active';this.button.hidden=true;this.button.classList.remove('motion-needed');return true
  }
  setVirtualRotation(degrees){this.virtualRotation=degrees}
  async enable(){
    const D=window.DeviceOrientationEvent;
    if(!D)throw new Error('unsupported');
    if(typeof D.requestPermission==='function'){const p=await D.requestPermission();if(p!=='granted')throw new Error('denied')}
    window.removeEventListener('deviceorientation',this.handle);
    window.addEventListener('deviceorientation',this.handle,{passive:true});
    this.active=true;this.status.textContent='tilt active';this.button.hidden=true;this.button.classList.remove('motion-needed');
  }
  disable(){
    window.removeEventListener('deviceorientation',this.handle);this.active=false;
    this.status.textContent='tilt off';
    this.button.hidden=false;this.button.classList.add('motion-needed');
  }
  handle=(e)=>{
    let x=clamp((e.gamma||0)/42,-1,1),y=clamp(((e.beta||0)-18)/42,-1,1);
    const physical=(screen.orientation&&typeof screen.orientation.angle==='number'?screen.orientation.angle:(window.orientation||0));
    const angle=(physical+this.virtualRotation)*Math.PI/180;
    let rx=x*Math.cos(angle)-y*Math.sin(angle),ry=x*Math.sin(angle)+y*Math.cos(angle);
    const baseRx=rx,baseRy=ry,mag=Math.hypot(rx,ry),delta=Math.hypot(rx-this.lastRx,ry-this.lastRy);
    const boost=.92+.16*Math.min(1,mag)+Math.min(.18,delta*.72);
    rx*=boost;ry*=boost;
    const boosted=Math.hypot(rx,ry),cap=1.18;
    if(boosted>cap){rx*=cap/boosted;ry*=cap/boosted}
    this.lastRx=baseRx;this.lastRy=baseRy;
    const g=this.game.world.gravityStrength;
    this.game.setGravity(rx*g,ry*g);
  }
}

class Preferences{
  static key='watergame.settings.v2';
  static defaults(){return {gravity:650,pump:760,pumpAngle:14,ring:1}}
  static load(){try{const v={...this.defaults(),...JSON.parse(localStorage.getItem(this.key)||'{}')};v.pumpAngle=clamp(v.pumpAngle,0,30);if(v.pump===620)v.pump=760;if(v.pumpAngle===9)v.pumpAngle=14;if(v.gravity===570||v.gravity===620)v.gravity=650;return v}catch{return this.defaults()}}
  static save(value){localStorage.setItem(this.key,JSON.stringify(value))}
}
class BackgroundStore{
  static open(){return new Promise((resolve,reject)=>{const req=indexedDB.open('WaterGame',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('assets'))req.result.createObjectStore('assets')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
  static async put(blob){const db=await this.open();return new Promise((resolve,reject)=>{const tx=db.transaction('assets','readwrite');tx.objectStore('assets').put(blob,'background');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
  static async get(){const db=await this.open();return new Promise((resolve,reject)=>{const tx=db.transaction('assets','readonly'),req=tx.objectStore('assets').get('background');req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}
  static async clear(){const db=await this.open();return new Promise((resolve,reject)=>{const tx=db.transaction('assets','readwrite');tx.objectStore('assets').delete('background');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
}
async function fileToImage(file){
  const url=URL.createObjectURL(file),img=new Image();
  await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
  URL.revokeObjectURL(url);return img;
}
async function cropImageFile(file,aspect){
  const img=await fileToImage(file),maxW=1600,maxH=Math.max(1,Math.round(maxW/aspect));
  let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight,ir=sw/sh;
  if(ir>aspect){sw=sh*aspect;sx=(img.naturalWidth-sw)/2}else{sh=sw/aspect;sy=(img.naturalHeight-sh)/2}
  const canvas=document.createElement('canvas');canvas.width=maxW;canvas.height=maxH;
  canvas.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,maxW,maxH);
  return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('crop failed')),'image/jpeg',.86));
}
async function blobToImage(blob){
  const url=URL.createObjectURL(blob),img=new Image();img._objectUrl=url;
  await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});return img;
}
const DUCKS=['./ducks/rubber-classic.svg','./ducks/rubber-round.svg','./ducks/rubber-baby.svg'];
async function remoteImage(url){
  const img=new Image();
  await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});return img;
}

class QuackSynth{
  constructor(){
    this.url='https://upload.wikimedia.org/wikipedia/commons/f/f1/Ducks_snatching.ogg';
    this.audio=new Audio(this.url);
    this.audio.preload='auto';
    this.audio.volume=1;
    this.audio.playbackRate=.86;
    this.audio.preservesPitch=false;
    this.audio.webkitPreservesPitch=false;
  }
  play(){
    try{
      this.audio.pause();
      this.audio.currentTime=0;
      this.audio.volume=1;
      const p=this.audio.play();
      p?.catch?.(()=>{});
    }catch{}
  }
}

class App{
  constructor(host){
    host.innerHTML='<main class="stage"><canvas aria-label="Water ring game"></canvas><div class="topbar"><div class="quick"><button class="iconbtn motion-needed" data-motion>Enable tilt</button><label class="upload-label" data-first-background>Background<input data-background-first type="file" accept="image/*"></label></div><div class="actions"><button class="iconbtn" data-change-duck>CHANGE DUCK</button><button class="iconbtn" data-fullscreen>Fullscreen</button><button class="iconbtn" data-settings>Settings</button></div></div><section class="settings" data-panel hidden><h2>Settings</h2><label class="setting"><span>Pump</span><input data-pump-force type="range" min="250" max="1300" step="10"><output data-pump-out></output></label><label class="setting"><span>Aim</span><input data-pump-angle type="range" min="0" max="30" step="1"><output data-angle-out></output><span class="angle-guide" aria-hidden="true"><i data-angle-line></i></span></label><label class="setting"><span>Gravity</span><input data-gravity type="range" min="150" max="1200" step="10"><output data-gravity-out></output></label><label class="setting"><span>Big rings</span><input data-ring-size type="range" min=".65" max="1.7" step=".05"><output data-ring-out></output></label><div class="settings-row"><label class="upload-label">Background<input data-background type="file" accept="image/*"></label><button data-random-duck>CHANGE DUCK</button><button data-hide-duck>Hide duck</button><button data-disable-tilt hidden>No tilt</button><button data-reset-all>Reset everything</button><button data-close-settings>Close</button></div><small><strong>Gravity:</strong> tilt it.<br><span data-status>Ready.</span><br>Picture stays here.</small></section><button class="pump left" data-pump="-1" aria-label="Left water pump"></button><button class="pump right" data-pump="1" aria-label="Right water pump"></button><a class="love" href="https://github.com/cheeseonamonkey" target="_blank" rel="noopener">made with love</a></main>';
    this.stage=host.querySelector('.stage');this.canvas=host.querySelector('canvas');this.status=host.querySelector('[data-status]');this.motionButton=host.querySelector('[data-motion]');this.panel=host.querySelector('[data-panel]');
    this.renderer=new CanvasRenderer(this.canvas);this.game=new GameSession(this.renderer);this.motion=new DeviceOrientationInput(this.game,this.status,this.motionButton);this.quack=new QuackSynth();
    this.prefs=Preferences.load();this.applyPreferences();this.bind(host);this.motion.startDefault();host.querySelector('[data-disable-tilt]').hidden=!this.motion.active;host.querySelector('[data-first-background]').hidden=localStorage.getItem('watergame.backgroundSeen')==='1';this.resize();this.restoreBackground();this.loadStartupDuck();this.game.start();
  }
  bind(host){
    const toggleFullscreen=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen?.();return false}const el=document.documentElement;if(el.requestFullscreen){await el.requestFullscreen({navigationUI:'hide'});return true}if(el.webkitRequestFullscreen){el.webkitRequestFullscreen();return true}}catch{}return null};
    this.motionButton.addEventListener('click',async()=>{try{await this.motion.enable();host.querySelector('[data-disable-tilt]').hidden=false}catch{this.status.textContent='tilt unavailable';this.motionButton.classList.remove('motion-needed')}});
    this.canvas.addEventListener('pointerdown',e=>{const r=this.canvas.getBoundingClientRect(),x=(e.clientX-r.left)*this.canvas.clientWidth/r.width,y=(e.clientY-r.top)*this.canvas.clientHeight/r.height;if(this.renderer.isDuckAt(x,y)){this.quack.play();navigator.vibrate?.(18)}});
    host.querySelector('[data-settings]').addEventListener('click',()=>{this.panel.hidden=!this.panel.hidden;host.querySelector('[data-disable-tilt]').hidden=!this.motion.active});
    host.querySelector('[data-close-settings]').addEventListener('click',()=>this.panel.hidden=true);
    host.querySelector('[data-disable-tilt]').addEventListener('click',e=>{this.motion.disable();e.currentTarget.hidden=true});
    host.querySelectorAll('[data-pump]').forEach(button=>{
      const release=()=>button.classList.remove('touching');
      button.addEventListener('pointerdown',e=>{e.preventDefault();button.classList.add('touching');button.setPointerCapture?.(e.pointerId);this.game.pump(Number(button.dataset.pump))});
      button.addEventListener('pointerup',release);
      button.addEventListener('pointercancel',release);
      button.addEventListener('lostpointercapture',release);
    });
    const fsButton=host.querySelector('[data-fullscreen]');
    fsButton.addEventListener('click',async()=>{const state=await toggleFullscreen();if(state===null)this.status.textContent=/iPhone|iPad|iPod/.test(navigator.userAgent)?'Use Add to Home Screen on iOS.':'Fullscreen unavailable.';});
    document.addEventListener('fullscreenchange',()=>{fsButton.textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen';this.resize()});
    const pump=host.querySelector('[data-pump-force]'),angle=host.querySelector('[data-pump-angle]'),gravity=host.querySelector('[data-gravity]'),ring=host.querySelector('[data-ring-size]');
    pump.value=this.prefs.pump;angle.value=this.prefs.pumpAngle;gravity.value=this.prefs.gravity;ring.value=this.prefs.ring;
    const refresh=()=>{host.querySelector('[data-pump-out]').textContent=this.prefs.pump;host.querySelector('[data-angle-out]').textContent=this.prefs.pumpAngle===0?'0°':this.prefs.pumpAngle+'° in';host.querySelector('[data-angle-line]').style.transform='rotate('+this.prefs.pumpAngle+'deg)';host.querySelector('[data-gravity-out]').textContent=this.prefs.gravity;host.querySelector('[data-ring-out]').textContent=this.prefs.ring.toFixed(2)+'×'};
    host.querySelector('[data-reset-all]').addEventListener('click',async()=>{this.prefs=Preferences.defaults();pump.value=this.prefs.pump;angle.value=this.prefs.pumpAngle;gravity.value=this.prefs.gravity;ring.value=this.prefs.ring;this.applyPreferences();localStorage.removeItem(Preferences.key);Preferences.save(this.prefs);refresh();this.game.reset();this.renderer.clearBackgroundImage();try{await BackgroundStore.clear()}catch{}try{this.renderer.setDuckImage(await remoteImage(DUCKS[0]))}catch{}localStorage.removeItem('watergame.backgroundSeen');firstBackground.hidden=false;this.status.textContent='Reset.';this.panel.hidden=true});
    pump.addEventListener('input',()=>{this.prefs.pump=Number(pump.value);this.game.setPumpStrength(this.prefs.pump);Preferences.save(this.prefs);refresh()});
    angle.addEventListener('input',()=>{this.prefs.pumpAngle=Number(angle.value);this.game.setPumpAngle(this.prefs.pumpAngle);Preferences.save(this.prefs);refresh()});
    gravity.addEventListener('input',()=>{this.prefs.gravity=Number(gravity.value);this.game.setGravityStrength(this.prefs.gravity);Preferences.save(this.prefs);refresh()});
    ring.addEventListener('input',()=>{this.prefs.ring=Number(ring.value);this.game.setRingScale(this.prefs.ring);Preferences.save(this.prefs);refresh()});
    refresh();
    const firstBackground=host.querySelector('[data-first-background]');
    const markBackgroundSeen=()=>{localStorage.setItem('watergame.backgroundSeen','1');firstBackground.hidden=true};
    firstBackground.addEventListener('click',markBackgroundSeen);
    const chooseBackground=async e=>{const file=e.target.files?.[0];if(!file)return;markBackgroundSeen();try{this.status.textContent='cropping background…';const blob=await cropImageFile(file,this.stage.clientWidth/this.stage.clientHeight);await BackgroundStore.put(blob);this.renderer.clearBackgroundImage();this.renderer.setBackgroundImage(await blobToImage(blob));this.status.textContent='background saved'}catch{this.status.textContent='could not save background'}e.target.value=''};
    host.querySelector('[data-background]').addEventListener('change',chooseBackground);
    host.querySelector('[data-background-first]').addEventListener('change',chooseBackground);
    let duckIndex=0;const changeDuck=async()=>{try{let next=duckIndex;while(DUCKS.length>1&&next===duckIndex)next=Math.floor(Math.random()*DUCKS.length);duckIndex=next;this.renderer.setDuckImage(await remoteImage(DUCKS[duckIndex]));this.status.textContent='Duck changed.'}catch{this.status.textContent='Duck failed to load.'}};
    host.querySelector('[data-change-duck]').addEventListener('click',changeDuck);
    host.querySelector('[data-random-duck]').addEventListener('click',changeDuck);
    host.querySelector('[data-hide-duck]').addEventListener('click',()=>{this.renderer.clearDuck();this.status.textContent='Duck hidden.'});
    window.addEventListener('resize',()=>this.resize());
    window.visualViewport?.addEventListener('resize',()=>this.resize());
    screen.orientation?.addEventListener?.('change',()=>this.resize());
  }
  applyPreferences(){this.game.setPumpStrength(this.prefs.pump);this.game.setPumpAngle(this.prefs.pumpAngle);this.game.setGravityStrength(this.prefs.gravity);this.game.setRingScale(this.prefs.ring)}
  async restoreBackground(){try{const blob=await BackgroundStore.get();if(blob)this.renderer.setBackgroundImage(await blobToImage(blob))}catch{}}
  async loadStartupDuck(){try{this.renderer.setDuckImage(await remoteImage(DUCKS[0]))}catch{}}
  resize(){
    const vv=window.visualViewport;
    const vw=vv?.width||window.innerWidth,vh=vv?.height||window.innerHeight;
    const forced=vh>vw;
    this.stage.classList.toggle('forced-landscape',forced);
    this.stage.style.left=((vv?.offsetLeft||0)+vw/2)+'px';
    this.stage.style.top=((vv?.offsetTop||0)+vh/2)+'px';
    this.stage.style.width=(forced?vh:vw)+'px';
    this.stage.style.height=(forced?vw:vh)+'px';
    const virtual=forced?-90:0;
    this.motion.setVirtualRotation(virtual);
    requestAnimationFrame(()=>this.game.resize(this.stage.clientWidth,this.stage.clientHeight));
  }
}
